<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Collection</title>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
            background-color: lightgray;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <table border="1" width="80%" cellpadding="10">
        <caption>Library Book Collection</caption>

        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Publication Year</th>
            <th>Genre</th>
        </tr>

        <tr>
            <td>Python Programming</td>
            <td>John Smith</td>
            <td>2020</td>
            <td>Programming</td>
        </tr>

        <tr>
            <td>Data Science Basics</td>
            <td>Alice Brown</td>
            <td>2021</td>
            <td>Technology</td>
        </tr>

        <tr>
            <td>Machine Learning</td>
            <td>David Johnson</td>
            <td>2022</td>
            <td>Artificial Intelligence</td>
        </tr>

        <tr>
            <td>The Great Novel</td>
            <td>Robert Lee</td>
            <td>2018</td>
            <td>Fiction</td>
        </tr>

        <tr>
            <td>History of India</td>
            <td>Anita Sharma</td>
            <td>2019</td>
            <td>History</td>
        </tr>

    </table>

</body>
</html>
